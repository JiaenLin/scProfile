name: scenic
summary: regulon activity per cell, from a network inferred from your own data
when_to_use: you want a gene regulatory network from this dataset rather than a prior
status: planned
plans_to_wrap: pyscenic
language: python
entry: run.py
needs_env: true
layer: stack
reversible: true
sees: []
design_aware: true
per_unit: sample
needs_layers:
  - "{counts}"
produces:
  - obsm[X_regulon_auc]
  - tables/regulon_targets.csv
executor:
  cost: high
  cores: 16
cannot_show:
  - CO-EXPRESSION WITH A MOTIF IS NOT REGULATION. Nothing here observes a perturbation, so no edge is causal.
  - Benchmarks recover very different numbers of TFs from the same data, so a single GRN result should not be reported alone.
  - A network inferred from pooled conditions describes the average of them and may describe neither, which is why this runs per sample.
