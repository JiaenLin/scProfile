# Reference data for scenic. Fetched with:  scprofile fetch scenic --to <dir>
#
# pySCENIC's second and third steps are not inference - they are a LOOKUP against cisTarget motif
# rankings and a motif-to-TF table. Without them `ctx` prunes nothing, every co-expression module
# survives, and the regulons returned are GRNBoost2's raw output wearing a regulon's name. That
# failure produces a full result file, which is why these are declared as a hard requirement and
# checked by digest rather than by presence.
#
# The rankings are large and organism-specific. `plan_fetch` reports the total and the free space
# before anything downloads, because filling a filesystem halfway through a 226 MiB file is a
# worse failure than refusing at the start.
#
# EVERY `size` BELOW IS THE VENDOR'S OWN Content-Length, from a HEAD request on 2026-08-21, and
# they are here because two of the notes were wrong by a factor of five. This file said the mm10
# rankings were "About 1.1 GB" and the hg38 rankings "About 1.4 GB"; they are 226 MiB and 297 MiB.
# An estimate in a comment is not checkable and drifts silently, which is why `size` is a field
# `status()` compares against the file on disk rather than a sentence in a note.
#
# BUDGET TIME, NOT ONLY SPACE - AND DO NOT BUDGET IT FROM ONE MEASUREMENT.
#
# PBS 676356 measured this vendor at 47,280 B/s from a compute node (curl got 33,232 B/s over the
# same 20 MB range request, so the limit was not the client), and this comment used to conclude
# from that "roughly two hours" for the mouse set and "two and a half" for the human one.
#
# PBS 676454 then fetched the ENTIRE human set - 391 MB, three files - in 27 SECONDS. About
# 14 MB/s, some three hundred times the earlier figure, on the same cluster against the same host.
#
# Both numbers are real. The vendor's rate varies by orders of magnitude and a walltime sized from
# either one is sized from a sample of one. Ask for hours and let the job finish early: the
# download is resumable through HTTP Range and a `.part` file, so a job killed at walltime loses
# only the time, and only if nobody resubmits it.
#
# The general form of this is worth keeping. A measurement is true of the moment it was taken, and
# a comment stating it as a property of the world is a comment that will be wrong later without
# anything noticing - which is what happened here, in a file whose whole purpose is recording
# things that are checkable.
#
# WHERE EVERY DIGEST CAME FROM. The vendor publishes no checksums, so the only place one can come
# from is a download that completed. The MOUSE three were computed by `fetch` on PBS 676356, the
# HUMAN three on PBS 676454, and all six were pasted here by hand on a workstation - the machine
# that downloads is not the machine that authors.
#
# Each was then confirmed by a SECOND, INDEPENDENT implementation reading the same bytes:
# `sha256sum` on PBS 676454 agrees with all six. A digest agreeing with the code that produced it
# is not evidence.
#
# The content was checked too, not just the bytes. Both rankings carry the Arrow magic at BOTH
# ends - a truncated file that got renamed to the finished name passes a leading-magic check and
# fails a trailing one - and their axes are what the filenames claim: hg38 is 5,876 motifs x
# 27,091 upper-case gene symbols, mm10 is 5,032 x 24,131 Title-case ones. 93% of the mouse TF list
# are columns of the mouse ranking, which is the cross-check that matters: a mouse ranking beside
# a human TF list returns a full, empty result rather than an error.
#
# Every declared `size` was arrived at TWICE and independently: the vendor's Content-Length from a
# HEAD request, and the bytes on disk after the download finished. All three agree exactly, which
# is also what says the downloads are complete rather than truncated.
#
# Source: resources.aertslab.org, the SCENIC authors' own distribution.
# Licence: the cisTarget databases are distributed by the Aerts lab for research use; the motif
# collection is derived from JASPAR, HOCOMOCO, SwissRegulon and others - see their site.

# The shape is FLAT - one entry per reference, with `organism` as a FIELD. It is not nested by
# organism; that was tried first and `references()` read it as two references called "mouse" and
# "human" with no url, which is the shape being asserted rather than measured.

