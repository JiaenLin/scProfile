name: liana
summary: cell-cell communication, consensus over several scoring methods
when_to_use: you want a ligand-receptor map and, with a design, how it differs between conditions
status: planned
plans_to_wrap: liana
language: python
entry: run.py
needs_env: true
layer: stack
reversible: true
sees: []
design_aware: true
per_unit: sample
needs_obs:
  - "{label}"
needs_layers:
  - "{lognorm}"
produces:
  - tables/ccc_edges.csv
executor:
  cost: medium
  cores: 8
cannot_show:
  - NO INTERACTION IS OBSERVED. These are co-expression of a ligand and a receptor in two populations, with no spatial information - on dissociated tissue the cells may never have touched.
  - A rank is within this dataset. It is not a strength comparable to another dataset's.
  - The resource decides the answer, and the default resource is HUMAN. A human resource on non-human symbols does not error; it returns a small plausible table.
  - Ligand and receptor transcripts are partly cytoplasmic, so a single-nucleus preparation reports fewer of them and a low interaction count is as consistent with the assay as with the biology.
