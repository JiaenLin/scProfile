name: cellcycle
summary: cell-cycle phase per cell, and the check that a trajectory is not a cell-cycle axis
wraps:
  tool: scanpy
  function: sc.tl.score_genes_cell_cycle
  homepage: https://scanpy.readthedocs.io
  license: BSD-3-Clause
  cite: "Tirosh et al., Science 2016 (gene sets); Wolf et al., Genome Biol 2018 (scanpy)"
language: python
entry: run.py
# Runs in the HOST interpreter. It needs scanpy, which the host already needs in order to read the
# object at all, so a separate environment for a two-minute scoring step would be friction with
# nothing behind it. Kernels that pin awkward dependencies declare needs_env: true instead.
needs_env: false
executor:
  cost: trivial
  cores: 1
design_aware: true
# WHAT IT READS, DECLARED. run.py takes `keys['lognorm']` and scores from that layer when it is
# present, falling back to X - so the layer is an input, and until 2026-08-22 nothing said so.
# The plan reads these declarations to tell the user which of their columns and layers each
# plugin will actually touch, and an under-declared manifest makes a plugin look like it reads
# nothing. `sees` is the honest list: what was shown to it, which is what another plugin's result
# has to be compared against.
sees:
  - X
  - layers[{lognorm}]
  - var_names
produces:
  - obs[phase]
  - obs[S_score]
  - obs[G2M_score]
cannot_show:
  - Phase is SCORED from a gene set, not measured. A cell scored G2M is one whose G2M genes are relatively high, which is not the same as a cell in G2M.
  - The gene sets are the standard human ones, title-cased for mouse. They are not tissue-specific and were not curated for this dataset.
  - On single nuclei the signal is weaker - cell-cycle transcripts are partly cytoplasmic - so a low score is as consistent with the assay as with a resting population.
  - A cycling population is not a proliferating one. Scoring says which genes are high, not how many cells divided.
