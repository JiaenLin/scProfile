name: velocity
summary: RNA velocity from spliced/unspliced counts - the DIRECTION of transcriptional change
when_to_use: your object carries spliced and unspliced layers and you want direction of change, not just position
wraps:
  tool: scvelo
  version: "0.3.4"
  homepage: https://scvelo.readthedocs.io
  license: BSD-3-Clause
  cite: "Bergen et al., Nat Biotechnol 2020"
language: python
entry: run.py
needs_env: true
# The one prerequisite most datasets fail, and it cannot be repaired later: spliced/unspliced
# counts come from the ALIGNER. An object quantified without them has no route to velocity short
# of re-running alignment from FASTQ or BAM.
needs_layers:
  - spliced
  - unspliced
# ... but the kernel goes and LOOKS for them before refusing. An object that has been through QC,
# annotation and integration has almost certainly lost these layers, while the aligner output is
# still on disk - and the upstream tools recorded where their own inputs were. The host harvests
# that chain from uns and passes it in; this kernel searches it for a velocyto .loom, an mtx
# triplet, or an .h5ad carrying both layers, and attaches what it finds BY BARCODE, within each
# sample. It refuses with a list of everywhere it looked rather than with "layers absent".
can_source_layers: true
# Parameters, all optional, passed as --params '{"mode": "dynamical", "n_top_genes": 3000}':
#   mode               stochastic (default) | deterministic | dynamical
#                      dynamical also fits kinetic rates and writes obs[latent_time]; it is the
#                      slow one, minutes to hours, and it is what you want if you intend to read
#                      per-gene kinetics rather than only the field.
#   n_top_genes        2000    genes carried into the fit
#   min_shared_counts  20      minimum spliced+unspliced counts for a gene to be fitted
#   n_pcs              30
#   n_neighbors        30
#   basis              obsm key to draw arrows on, without the X_ prefix. Default: the first of
#                      umap, scanvi, scvi, harmony, tsne, pca present - so an integrated
#                      embedding wins, and the arrows land on the same manifold the annotation
#                      and the rest of the report already use.
#   min_dist           0.2     only used if no embedding exists and one has to be computed
#   min_confidence     0.5     below this MEDIAN, the run reports `partial` and says the field is
#                              unresolved rather than presenting it as a direction
#   n_jobs             honours NCPUS / PBS_NCPUS / SLURM_CPUS_PER_TASK before the machine's count
executor:
  cost: high
  cores: 8
  memory_gb_per_100k: 12
design_aware: true
produces:
  - obs[velocity_confidence]
  - obs[velocity_length]
  - obs[velocity_pseudotime]
  - obs[latent_time]
  - obsm[velocity_*]
  - objects[velocity_h5ad]
  - velocity_by_label.csv
  - velocity_transitions.csv
  - velocity_genes.csv
cannot_show:
  - Velocity is a DIRECTION, not a rate of change in real time. Arrow length is not speed in hours, and two datasets' arrow lengths are not comparable.
  - The validated single-nucleus use is DIRECTIONAL. Nucleus and cell velocities correlate 0.94-0.99 on matched microglia (Sci Rep 2024), but that study projected vectors and measured cell speed - it did not derive a pseudotime from them. `velocity_pseudotime` rests on more assumptions than the arrows do.
  - Quantification choices change the answer. How intronic reads were counted, and whether the reference included intronic regions, alter library size, cell-type assignment and therefore velocity - so a velocity result is a property of the alignment as much as of the biology.
  - snRNA intronic reads carry a GENE LENGTH BIAS, in both exonic and intronic counts. A long gene contributes more unspliced signal for reasons that are not kinetic.
  - Unspliced counts are noisy, especially for 3-prime tagging chemistries. Nuclei have proportionally more intronic signal than cells, which helps - but the per-gene counts are still small.
  - Unspliced mRNA is read as a transitional state, and need not be. A stable population can hold an unspliced reservoir for rapid transcription-independent expression, and looks identical here.
  - These counts are NOT ambient-corrected. Correction is applied to total counts and cannot be decomposed into spliced and unspliced parts. Published snRNA velocity does not correct either, and the effect is contained to this kernel's own outputs - nothing else in the object reads these layers.
  - The arrows are drawn as a PROJECTION into two dimensions. The fit happens in gene space, and a 2-D layout that tore the manifold can make a coherent field look incoherent, or the reverse. Read the field beside velocity_confidence, never alone.
