name: de
summary: which genes change, per cell type, across the design
when_to_use: you have a design table with replicates and want differential expression
status: planned
plans_to_wrap: pydeseq2
language: python
entry: run.py
needs_env: false
layer: stack
reversible: true
sees:
  - design
needs_design: true
needs_obs:
  - "{label}"
needs_layers:
  - "{counts}"
produces:
  - tables/de_*.csv
executor:
  cost: medium
  cores: 4
cannot_show:
  - A gene absent from the object was not tested, and its absence is not evidence of no change.
  - Pseudobulk cannot see a change confined to a SUBPOPULATION of a labelled type; it averages it away.
  - A coefficient in a confounded design is not interpretable in isolation, whatever its p-value.
  - Per-cell testing treats cells from one animal as independent samples and inflates significance by roughly the number of cells per animal. It is offered, never defaulted to.
