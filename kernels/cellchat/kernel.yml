name: cellchat
summary: cell-cell communication, CellChat's own database and scoring
when_to_use: you want a second communication method to hold beside the first
status: planned
plans_to_wrap: CellChat
language: r
entry: run.R
needs_env: true
layer: stack
reversible: true
sees: []
design_aware: true
per_unit: sample
needs_obs:
  - "{label}"
needs_layers:
  - "{lognorm}"
produces:
  - tables/ccc_edges.csv
executor:
  cost: medium
  cores: 4
cannot_show:
  - NO INTERACTION IS OBSERVED, for the same reason as any expression-only method.
  - Its database is its own. Agreement with another method is evidence; disagreement is a finding about the databases as much as about the cells.
  - Scores are not comparable with another method's - they are on different scales and only the ranking can be compared.
