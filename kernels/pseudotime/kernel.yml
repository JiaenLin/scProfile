name: pseudotime
summary: ordering along a trajectory, oriented by velocity where it exists
when_to_use: you have a continuum you believe is a progression and want cells ordered along it
status: planned
plans_to_wrap: cellrank
language: python
entry: run.py
needs_env: true
layer: stack
reversible: true
sees: []
design_aware: true
needs_obsm:
  - "{embedding}"
needs_kernels:
  - cellcycle
produces:
  - obs[pseudotime]
  - obs[fate_*]
  - tables/lineage_drivers.csv
executor:
  cost: high
  cores: 8
cannot_show:
  - An ORDER is not elapsed time. Distance along a graph is not duration, and two datasets' pseudotimes are not comparable.
  - A continuum of states and a continuum of cells MOVING THROUGH states look identical here. Nothing distinguishes them without a second axis.
  - Without velocity the axis has no orientation. Which end is the start is then a decision, normally an analyst pointing at a cluster.
  - A trajectory that follows the cycling fraction may be a cell-cycle axis. That is why cellcycle is a prerequisite rather than a sibling.
