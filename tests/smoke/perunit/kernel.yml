name: perunit
summary: a site plugin that exercises the per-unit path end to end, so its defects are not latent
# NO `wraps:` BLOCK, and that is not an oversight. This plugin wraps no tool - it computes nothing
# biological - so requiring an UPSTREAM.md of it would be requiring a record of a tool that does
# not exist. `validate` refused it on the first run for declaring `wraps: {tool: none}`, which was
# the check working correctly: `none` is a truthy mapping and the requirement fired.
language: python
entry: run.py
needs_env: false
per_unit: sample
sees:
  - obs[sample]
  - X
executor:
  cost: trivial
  cores: 1
design_aware: false
produces:
  - obs[perunit_score]
  - obsm[X_perunit]
cannot_show:
  - It computes nothing biological. It exists to make the per-unit code path observable in a real run.
  - The scores are drawn from a seeded generator. Any structure in them is the seed, not the data.
