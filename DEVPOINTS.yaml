# What can be added to scProfile. Read by `sch dev map`; see the harness's sch/dev/points.py.
tool: scprofile
devpoints: 1
# The word list this repository must not contain lives OUTSIDE it, in the project that owns
# the cohort: $SCPROFILE_FORBIDDEN_TERMS, the convention tests/test_portability.py already uses.
# A tool that ships the vocabulary in order to check that it does not ship the vocabulary
# has shipped it.

tests:
  # `--jobs {jobs}` is filled from the scheduler's allocation, or the CPU count off a
  # scheduler. One subprocess per suite either way; only the waiting is removed. Measured
  # IDENTICAL to the serial report on this suite set (PBS 707231) before being turned on.
  command: ["{python}", "tests/run_all.py", "--jobs", "{jobs}"]

# `plan` runs nothing and resolves everything: the kernel's manifest, what it injects, what it
# needs in obs and obsm, whether it is design-aware, and what stops it. It is the cheapest honest
# exercise of a kernel's declaration, and it is fast enough to run on every edit.
fixture:
  command:
    - ["{python}", "-m", "scprofile.cli", "validate", "{name}"]
    # --prefix is where a kernel's environment WOULD go. Without it `plan` plans everything
    # correctly and then exits 2 saying the plugin is not prepared in this installation, which
    # is the tool being right and the declaration being incomplete.
    - ["{python}", "-m", "scprofile.cli", "plan", "--h5ad", "{observations}",
       "--kernel", "{name}", "--design", "{design}", "--prefix", "{out}/prefix"]
  products: []
  timeout: 900
  # `plan` computes the whole plan against the data and then exits 2 where the kernel's own
  # environment has not been built in this installation. That is the tool being right - the
  # kernel point already declares it cannot prove the environment installs - so the refusal is
  # accepted, and `refusal_says` is what makes it a refusal rather than a crash.
  accepts_refusal: true
  refusal_says: "are not ready in this installation"

baseline_dir: tests/baselines

# THE RULES OF THIS DEVELOPMENT ROUND. `sch dev rules --root . --since REF` checks them; without
# this block it has nothing to check and says so rather than passing.
#
# WHY A ROUND NEEDS RULES AND NOT GOOD INTENTIONS. The maker's only real evidence is a plugin it
# has never seen, and ordinary helpfulness destroys that evidence: repair the eight plugins that
# are broken and there is nothing left to test the maker on; hand-edit the one being converted and
# the maker is no longer what produced it. Both feel like progress at the time. Each rule below
# names the thing that stops being true if it is broken.
rules:
  # WHEN THE ROUND STARTED, PINNED. Two of these rules are answered from git, so whoever chooses
  # the range chooses the answer, and the flattering range is always available. It is declared
  # here so that moving it is a diff a reader can see.
  #
  # AND WHAT IS ON THE OTHER SIDE OF IT, recorded rather than hidden. `f127a2b` is the last commit
  # that touched a held-out kernel: it carried the liana accounting - 8 of 12 exported plotting
  # functions ruled, the other 4 named as owed - and it is the commit at which the held-out rule
  # took effect. That work is NOT being undone, because undoing it would be one more edit to a
  # held-out plugin. From this commit forward the eight are untouched, and that is a falsifiable
  # claim rather than a recollection.
  since:
    commit: f127a2b
    means: >
      the last commit that touched a held-out kernel, and the point from which the held-out rule
      applies. Everything after it is the round this suite checks
  # RULE 1. A PLUGIN IS MAKER OUTPUT. If a plugin is wrong the maker is wrong; the change goes
  # into the maker and the plugin changes as a consequence, or it is an answer to a worksheet the
  # maker asked for. Neither of those can be read off a diff, so what is checked is the thing that
  # is left behind when the rule is broken: GENERAL MECHANISM, COPIED. Method is written once
  # because it is about one method. Mechanism appears twice because it is about all of them.
  #
  # MEASURED HERE. `cellchat` carried three near-identical copies of a ceiling reader and six of a
  # draw wrapper. One of those copies records, in its own comment, a run in which a function
  # present in two of them was missing from the third: "could not find function ndev" halted a
  # framing loop, one framing of two was drawn and neither heatmap was. A generated definition
  # cannot have that defect. Three hand-written ones cannot avoid it.
  maker_output:
    min_block: 8
    means: >
      general mechanism inside a plugin is generated by the maker or written once by the host -
      never copied. A block repeated inside one plugin, or shared between two, is mechanism that
      escaped the maker
  # RULE 2. THE OTHER EIGHT ARE HELD OUT. They are the only evidence the maker is general, and
  # they are spent the moment they are touched - including by fixing them. abundance's
  # pertpy/statsmodels ImportError and de's unsatisfiable `pydeseq2 >=0.5,<0.6` STAY BROKEN;
  # pseudotime's undeclared `scipy` stays undeclared. "liana sits at 8 of 12" is a RESULT.
  held_out:
    names: [abundance, cellcycle, de, decoupler, liana, pseudotime, scenic, velocity]
    means: >
      the held-out set is the maker's test set. A repair to one of these fits the maker to it, and
      the next unseen tool is then the first real test with the evidence already spent
  # RULE 3. GENERAL MECHANISM AND THE AGENTIC LAYER ARE WORKED ON IN PLACE. These are the paths a
  # change is allowed to land in. The artefact being converted is in scope by definition and is
  # not listed here; `held_out` above is what rules on the rest.
  in_place:
    # `.claude` IS THE AGENTIC LAYER and the rule names it in the same breath as the host: the
    # skills and hooks an agent reads are mechanism exactly as `scprofile/` is.
    paths: [scprofile, tests, docs, setup, jobs, .claude, DEVPOINTS.yaml, ROADMAP.md, README.md,
            DESIGN.md, DEVELOPMENT.md, BUILD_PLAN.md, UPSTREAM.md, KNOWN_ISSUES.md, VERSION,
            pyproject.toml]
    means: >
      the host, its suites and its documentation are the mechanism this round exists to improve;
      a change outside them and outside the converted artefact is scope this round did not agree
  # RULE 4. END TO END IS ONE PLUGIN. What runs on the real cohort is exactly the complement of
  # the held-out set, and the two lists may not quietly grow into each other.
  end_to_end:
    names: [cellchat]
    means: >
      the end-to-end exercise is cellchat alone, with the other eight unplugged - which is also
      what made the environment it had always borrowed from resolve to one member and exposed two
      packages it had never declared


points:
  kernel:
    what: one method, hosted - its own environment, its own references, its own page
    lives: kernels
    # MEASURED, NOT ASPIRED TO. This list was first written from the accessor names on
    # scprofile/kernels.py, and three of them - needs_obs, caveats and (for four kernels) sees -
    # are not one-file PLUGIN keys at all: they are accessors on the legacy directory shape,
    # reading kernel.yml. A newcomer's kernel was reported as complete while missing all three,
    # and the declaration tier printed their names without checking them. These seventeen are
    # what all nine shipped kernels actually declare, and they are now checked by parsing.
    must_declare: [api, version, state_version, summary, when_to_use, wraps, cannot_show,
                   inject, provides, produces, config, requires, cost, cores,
                   memory_gb_per_100k, report, upstream]
    example: abundance
    # This tool has its own scaffolder and it is better than a generic one - it renders the
    # commented one-file template from the format's own knowledge. `sch dev new` defers to it.
    scaffold_command: "python -m scprofile.cli scaffold {name} --new"
    # THERE IS NO LONGER ANYTHING TO REGISTER. This was the real admission gate and it was
    # written down nowhere: a kernel had to appear as a row in ROADMAP.md's Tier 0 table, and a
    # newcomer found that out by running the suite and watching it go red. Two hand edits, in a
    # document, in both directions - a deleted kernel left its row behind and a count word above
    # the table with it.
    #
    # The table is now RENDERED from the declarations. The row still has to be there, so the
    # check stays, but the way to satisfy it is a command rather than an edit - which is why the
    # command is named here as well as in the failure.
    register:
      - {file: ROADMAP.md, pattern: "^\\| `{name}` \\|",
         fix: "python -m scprofile.cli generated --write"}
    tests: [tests/smoke]

    # HOW A RAW TOOL BECOMES ONE OF THESE. Read by `sch dev convert`, which holds no field names
    # of its own - the stages are general, the fields are this format's, and only this repository
    # knows which stage fills which.
    #
    # THE ORDER IS THE DEPENDENCY. `account` cannot run before `inventory` has said what the tool
    # exports, and `judgement` is last because every earlier stage is evidence for it.
    #
    # `kind: judgement` marks the stages no extractor can do. Keeping them in the same list as the
    # mechanical ones is the point: a conversion that stopped listing them would look finished
    # while the plugin still could not say what its result must not be read as.
    convert:
      placeholder: "TODO"
      upstream: wraps.tool
      # WHAT TO PUT IN FRONT OF SOMEBODY RULING ON AN UPSTREAM PLOT. Both halves of the decision
      # come from this declaration and the worksheet was showing only the tool's: on liana,
      # eight of twelve rulings turned on one line of `cannot_show` saying the method has no
      # spatial information, and `superseded_by_design` cannot be written at all without the
      # id of the panel that supersedes.
      ruling_context: [report.figures, cannot_show]
      # WHICH FIELD IS A CLAIM ABOUT THE CODE. `must_declare` above says `version` has to EXIST;
      # nothing said it has to be TRUE, and no stage fills it because no stage can - it is not
      # extracted from CellChat or scvelo and it is not a judgement about the method, it is a
      # fact about this file's own history. `sch dev convert freshness` reads it from here and
      # asks git; it reports and never writes, like every other registration check in the suite.
      #
      # THE OTHER TWO VERSION-SHAPED FIELDS ARE NOT THIS ONE AND MUST NOT BE NAMED HERE. `api` is
      # the HOST contract a kernel was written against - it moves when scprofile/declare.py moves
      # and no kernel edit can make it stale. `state_version` versions the NUMBERS, by its own
      # definition in declare.py: it rises when the same inputs would give different output, so
      # thirty-five added legends correctly do not move it. Only `version` says "this is the
      # code", and only `version` is checked.
      version_field: version
      version_means: >
        the REUSE KEY. scprofile/cli.py hands it to landscape.wanted(); a run started with
        --reuse-from matches an earlier unit carrying the same key and licence.adopt() hardlinks
        that unit's products in rather than recomputing them. Change what a kernel draws, leave
        this alone, and every reusing run serves the old panels and prints REUSED - a stale
        result reported as a clean success, which is the one failure mode reuse can have
      # HOW THIS REPOSITORY TURNS REQUIREMENTS INTO ENVIRONMENTS, so the maker can ask what a
      # SHARED one lends its members. Nothing in `sch/` knows the resolver, the grouping call, or
      # the names of the fields a requirement is made of; they are all here, like `version_field`
      # above, and they are read by `sch dev convert borrowed`.
      #
      # WHY THE MAKER NEEDS THIS AT ALL, MEASURED. cellchat spent its whole life in a seven-member
      # environment. Unplugged, it resolves to a one-member one - correctly - and two of its
      # drawing paths died there: `there is no package called 'Seurat'` and `Cannot find UMAP`.
      # Its selftest still passed, because neither is imported at module scope. The question is
      # answerable from these declarations with no run: resolve alone, resolve with the family,
      # subtract.
      environment:
        catalogue: kernels.discover
        plugin_named: name
        groups: resolve.group_by_compatibility
        environment_named: name
        shared_by: members
        # A DECLARED ENTRY IS NOT THE NAME A PLUGIN WRITES, and the two texts a plugin is made of
        # spell a package differently. `written_in: host` is this file's own Python; `embedded` is
        # a script of another language inside it. Scoping matters and was measured: searched in
        # the host text, `r-matrix`, `r-shape`, `r-base` and `r-cluster` matched the English words
        # `matrix`, `shape`, `base` and `cluster` in seven plugins' comments.
        holds:
          - field: packages
            what: python packages
            spelled:
              - {as: "^(.+)$", written_in: host}
          - field: conda
            what: conda packages
            spelled:
              - {as: "^(.+)$", written_in: host}
              - {as: "^r-(.+)$", written_in: embedded}
              - {as: "^bioconductor-(.+)$", written_in: embedded}
          - field: r
            what: R packages
            spelled:
              - {as: "^(?:.*/)?([^/@=]+)", written_in: embedded}
      # TWO PHASES, AND THE SPLIT IS NOT COSMETIC. A `build` stage reads SOURCE - this plugin's own
      # code, or the wrapped tool's signatures and namespace - and touches no data, so it cannot be
      # shaped around one cohort. A `test` stage needs something to run on, and that is where a
      # fixture or a dataset you already have belongs.
      #
      # Written down because the pull is real: the memory measurement needs a run, the real cohort
      # is where the data is, and reaching for it during a BUILD is how a plugin ends up fitted to
      # one dataset. A build that is complete says the plugin is finished as code and was written
      # with no data in front of it. Whether it is right is the test stage's question.
      stages:
        - name: contract
          phase: build
          fills: [inject, produces]
          why: what the method is given and what it leaves behind
        - name: defaults
          phase: build
          fills: [config]
          why: >
            the wrapped tool's OWN defaults, declared rather than inherited - decoupler's `min_n`
            and cellrank's terminal-state method were both being passed silently
        - name: references
          phase: build
          fills: [references]
          why: >
            every resource consulted that did not come from the user's object, with its tier - a
            reference nobody declared is one the plan cannot warn about
        - name: inventory
          phase: build
          fills: [native_plots]
          # PRESENT IS NOT FINISHED. A wrapper part-way through declares some entries AND an
          # admission naming what is left; without this the field's presence read as done.
          outstanding_if: wraps.plots_unreviewed
          why: >
            what the wrapped tool already draws. cellchat used 1 of 30 until somebody looked; after
            the accounting it uses 32 of 35
        - name: legends
          phase: build
          fills: [report.figures]
          # EVERY ENTRY, NOT THE FIELD. The list exists from the first figure declared, so a
          # stage that only asked whether `report.figures` is there reported done with eight of
          # nine panels never ruled on.
          each_item_declares:
            drawn_by: [tool, plugin]
          # AND EVERY PLACE THE PLUGIN ACTUALLY PRODUCES A PANEL, which is not in this
          # declaration at all. MEASURED ON A SEALED RUN: 711 panels, 69 with a written legend,
          # 642 without - and the 642 come out of 35 call sites in one file, every one of which
          # calls a wrapper that already HAS a legend parameter and passes nothing to it. The
          # legend is not missing from the format; it is missing from the call sites, and until
          # this key existed nothing in the suite reported that. The sites are found by reading
          # the plugin's source - see sch/dev/extract/draw_sites.py - so a plugin needs no
          # declaration of its own draw wrappers and none of them was edited to be checked.
          each_draw_site_describes: true
          # HOW THE DEBT IS PAID, because a stage that reports one and does not say is a dead end
          # this suite has already met twice.
          finished_by: >
            `sch dev convert legends --root . --point kernel --name <plugin>` prints one row per
            silent draw site - the panel name as written, the plotting call under it, and the
            argument to add. Write the sentence AT THE CALL SITE, where the numbers that describe
            the panel still exist, and re-run this status: the count falls as the sites are
            answered
          why: >
            who drew each panel. `tool` is the wrapped tool's own plotting function, unmodified.
            `plugin` is this plugin drawing the tool's NUMBERS itself - a second scale, a derived
            matrix, an annotation layer - which is a different claim about provenance and is
            exactly what the upstream-plot accounting exists to protect. With this absent the
            reporter asserted `tool` for every undescribed panel, so a plugin-drawn figure was
            reported as the tool's own encoding and the accounting was undone at the last step.
            The LEGEND ITSELF is not declared here: it is written where the figure is drawn, out
            of numbers no build stage has - the n, the cap that was applied, the populations that
            were dropped - and is read back from captions.tsv when the plugin runs
        - name: placement
          phase: build
          fills: [report.figure_position]
          # WHICH DECLARATIONS NAME A FIGURE FAMILY, and how to read an id out of each. Nothing
          # in `sch/` knows that this format keeps upstream plots in `native_plots` with their
          # filenames written into a prose `use:`, or that a plugin's own plates carry an `id`.
          # Both are facts about this repository's format and both are declared here, like
          # `version_field` and `environment.holds` above.
          places_every:
            - field: native_plots
              named_by: use
              # A PLACEHOLDER MEANS ONE PANEL PER DATA ITEM. `nativecmp_chord_cell__<pathway>`
              # draws once per pathway and `nativecmp_signalingChanges__<population>` once per
              # shared population - 72 and 62 panels on this cohort, and 240 on one with forty
              # populations. The count is not knowable until a cohort arrives, which is exactly
              # why the ceiling belongs in the declaration.
              per_item: "<"
              bound: at_most
            - field: report.figures
              named_by: id
          positions: [overview, contrast, conclusion, appendix]
          # WHAT A CEILING IS COUNTED IN. `at_most: 6` is a number with no units until the
          # declaration says whether the family is drawn once per unit, once per arm-pair
          # comparison, or once for the whole cohort - and until it does, no figure count can be
          # computed before a job is submitted. Read as a prefix map like `figure_position`, so a
          # plugin whose families are named by phase states it in two rules.
          axis_field: report.figure_axis
          axes: [unit, contrast, cohort]
          # A CEILING THE DRAWING CODE DOES NOT READ IS A COMMENT. Measured: a plugin declaring
          # 49 ceilings, every guard stripped out of its embedded R, and the whole build phase
          # green - `placement` reporting every family bounded and `status` reporting build 7 of
          # 7 complete. Deleting a DECLARATION turns this stage red at once; deleting the code
          # that honours it turned nothing red, and that asymmetry is what let general mechanism
          # be hand-written into one plugin and called finished.
          #
          # `token` is what this format calls the thing where the drawing code reads it -
          # `figure_context.tsv` carries `ceiling:<family>` rows. `returns` is what leaving a
          # wrapper looks like in the language it is written in. Neither is known to `sch/`.
          enforced_by:
            token: ceiling
            returns: return
          # AND THAT THE CODE HONOURING IT IS THE MAKER'S OUTPUT, not a hand-written file that
          # satisfies the check. DEMANDED, CHECKED and GENERATED are three different claims, and
          # for a while this repository had the first two and reported the third: the command
          # below CRASHED for every kernel here - it wrote the six-file layout `scprofile/plugin.py`
          # replaced, and a one-file kernel's path is a file, so it tried `kernels/<name>.py/run.py`
          # - which means the wrapper it was said to generate had never once been generated.
          #
          # `{out}` is a scratch directory the suite makes; `{python}` is the HOST's interpreter,
          # because this generator is this repository's own tool whatever language the plugin
          # draws in. The comparison is byte for byte.
          generated_by:
            command: ["{python}", "-m", "scprofile.cli", "scaffold", "{name}",
                      "--dir", "{out}", "--force"]
          finished_by: >
            `sch dev convert placement --root . --point kernel --name <plugin>` prints one row
            per family that has no position and one per per-item family with no ceiling. Add a
            `report.figure_position` prefix rule for the first and an `at_most:` for the second,
            then cap the loop that draws it - the declaration and the code have to agree, and
            only the second one actually stops drawing
          why: >
            WHICH FIGURES A RESULT IS WRITTEN FROM, AND HOW MANY OF EACH THERE ARE. Measured on a
            sealed run: 1187 figures for one plugin, of 81 kinds, of which the composed section
            cites 31 kinds and 90 files. The other fifty kinds are drawn per unit, per pathway or
            per population, and the writing step was waiting on all of them. `appendix` is how a
            plugin says a kind is drawn and no result is written from it: it stays on the pages
            and stays reviewable, but it is not numbered, no sentence can cite it, it does not
            gate the writing, and it is not written a second time as a vector copy - 180 of those
            on this cohort, for plates the section never mentions
        - name: measure
          phase: test
          fills: [memory_gb_base, memory_gb_per_100k]
          # A COMMAND, LIKE `tests` AND `fixture` ALREADY ARE. The harness must not know what a
          # run directory of this tool looks like. `{run}` is filled from `--run`.
          command: ["{python}", "-m", "scprofile.cli", "capacity", "--out", "{run}", "--memory"]
          why: >
            both terms, from a real run. A rate alone attributes the fixed cost to the cells and
            the job is sized to be killed on small objects. Every run already fits this and stores
            it in report.json; `capacity --memory` is what reads it back out
        - name: promised
          phase: test
          fills: [native_plots]
          # A COMMAND, like `measure`, because only a run can answer it. `{run}` is filled from
          # `--run`.
          command: ["{python}", "-m", "scprofile.cli", "capacity", "--out", "{run}", "--promised"]
          why: >
            every upstream plot this plugin DECLARES it draws produced a file. The declaration is
            a promise and nothing read it back: the host reads `native_plots` FORWARDS, to say
            which function drew a panel, and never backwards, so a declared plot that drew nothing
            was invisible to every gate - the suites pass because the code is well formed, and
            `capacity --against` compares two runs that are missing the same thing and agrees.
            Measured: the sealed reference carries 8 declared plots that have never been drawn,
            and a plugin unplugged from the environment it had always shared lost 3 more to two
            packages it never declared, one of them reached only from inside an upstream function
            where no import in this repository names it. Asked ACROSS THE RUN and not per unit,
            because a comparison panel is legitimately absent from a single-sample unit

        - name: judgement
          phase: build
          kind: judgement
          fills: [summary, when_to_use, cannot_show, report, upstream]
          why: >
            what no extractor can answer - what this is for, what a reader must not conclude from
            it, and the question each figure is on the page to settle
    proves: >
      its manifest resolves, its injects and needs are declarable, and the host can plan a run
      without it - a kernel that cannot be planned cannot be refused for the right reason
    cannot_prove: >
      that its numbers are right, or that its environment installs - `scprofile selftest` is the
      second question and a real run is the third
    notes: >
      A KERNEL MUST NEVER NAME ANOTHER KERNEL. It names a capability and the host resolves it;
      see needs_capabilities in scprofile/kernels.py. `scprofile scaffold` writes the build
      skeleton for a declared kernel and is the right first command.

  panel:
    what: a figure the report composes, at one shared scale across kernels
    lives: scprofile
    must_declare: [what the panel shows, what it CANNOT show, the scale it shares]
    example: compare_panel
    proves: "it draws from the merged tables and scrolls rather than rescaling per panel"
    cannot_prove: "that it reads correctly to somebody who did not build it"
