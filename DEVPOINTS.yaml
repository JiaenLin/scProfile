# What can be added to scProfile. Read by `sch dev map`; see the harness's sch/dev/points.py.
tool: scprofile
devpoints: 1
# The word list this repository must not contain lives OUTSIDE it, in the project that owns
# the cohort: $SCPROFILE_FORBIDDEN_TERMS, the convention tests/test_portability.py already uses.
# A tool that ships the vocabulary in order to check that it does not ship the vocabulary
# has shipped it.

tests:
  # `--jobs {jobs}` is filled from the scheduler's allocation, or the CPU count off a
  # scheduler. One subprocess per suite either way; only the waiting is removed. Measured
  # IDENTICAL to the serial report on this suite set (PBS 707231) before being turned on.
  command: ["{python}", "tests/run_all.py", "--jobs", "{jobs}"]

# `plan` runs nothing and resolves everything: the kernel's manifest, what it injects, what it
# needs in obs and obsm, whether it is design-aware, and what stops it. It is the cheapest honest
# exercise of a kernel's declaration, and it is fast enough to run on every edit.
fixture:
  command:
    - ["{python}", "-m", "scprofile.cli", "validate", "{name}"]
    # --prefix is where a kernel's environment WOULD go. Without it `plan` plans everything
    # correctly and then exits 2 saying the plugin is not prepared in this installation, which
    # is the tool being right and the declaration being incomplete.
    - ["{python}", "-m", "scprofile.cli", "plan", "--h5ad", "{observations}",
       "--kernel", "{name}", "--design", "{design}", "--prefix", "{out}/prefix"]
  products: []
  timeout: 900
  # `plan` computes the whole plan against the data and then exits 2 where the kernel's own
  # environment has not been built in this installation. That is the tool being right - the
  # kernel point already declares it cannot prove the environment installs - so the refusal is
  # accepted, and `refusal_says` is what makes it a refusal rather than a crash.
  accepts_refusal: true
  refusal_says: "are not ready in this installation"

baseline_dir: tests/baselines

points:
  kernel:
    what: one method, hosted - its own environment, its own references, its own page
    lives: kernels
    # MEASURED, NOT ASPIRED TO. This list was first written from the accessor names on
    # scprofile/kernels.py, and three of them - needs_obs, caveats and (for four kernels) sees -
    # are not one-file PLUGIN keys at all: they are accessors on the legacy directory shape,
    # reading kernel.yml. A newcomer's kernel was reported as complete while missing all three,
    # and the declaration tier printed their names without checking them. These seventeen are
    # what all nine shipped kernels actually declare, and they are now checked by parsing.
    must_declare: [api, version, state_version, summary, when_to_use, wraps, cannot_show,
                   inject, provides, produces, config, requires, cost, cores,
                   memory_gb_per_100k, report, upstream]
    example: abundance
    # This tool has its own scaffolder and it is better than a generic one - it renders the
    # commented one-file template from the format's own knowledge. `sch dev new` defers to it.
    scaffold_command: "python -m scprofile.cli scaffold {name} --new"
    # THERE IS NO LONGER ANYTHING TO REGISTER. This was the real admission gate and it was
    # written down nowhere: a kernel had to appear as a row in ROADMAP.md's Tier 0 table, and a
    # newcomer found that out by running the suite and watching it go red. Two hand edits, in a
    # document, in both directions - a deleted kernel left its row behind and a count word above
    # the table with it.
    #
    # The table is now RENDERED from the declarations. The row still has to be there, so the
    # check stays, but the way to satisfy it is a command rather than an edit - which is why the
    # command is named here as well as in the failure.
    register:
      - {file: ROADMAP.md, pattern: "^\\| `{name}` \\|",
         fix: "python -m scprofile.cli generated --write"}
    tests: [tests/smoke]

    # HOW A RAW TOOL BECOMES ONE OF THESE. Read by `sch dev convert`, which holds no field names
    # of its own - the stages are general, the fields are this format's, and only this repository
    # knows which stage fills which.
    #
    # THE ORDER IS THE DEPENDENCY. `account` cannot run before `inventory` has said what the tool
    # exports, and `judgement` is last because every earlier stage is evidence for it.
    #
    # `kind: judgement` marks the stages no extractor can do. Keeping them in the same list as the
    # mechanical ones is the point: a conversion that stopped listing them would look finished
    # while the plugin still could not say what its result must not be read as.
    convert:
      placeholder: "TODO"
      upstream: wraps.tool
      # TWO PHASES, AND THE SPLIT IS NOT COSMETIC. A `build` stage reads SOURCE - this plugin's own
      # code, or the wrapped tool's signatures and namespace - and touches no data, so it cannot be
      # shaped around one cohort. A `test` stage needs something to run on, and that is where a
      # fixture or a dataset you already have belongs.
      #
      # Written down because the pull is real: the memory measurement needs a run, the real cohort
      # is where the data is, and reaching for it during a BUILD is how a plugin ends up fitted to
      # one dataset. A build that is complete says the plugin is finished as code and was written
      # with no data in front of it. Whether it is right is the test stage's question.
      stages:
        - name: contract
          phase: build
          fills: [inject, produces]
          why: what the method is given and what it leaves behind
        - name: defaults
          phase: build
          fills: [config]
          why: >
            the wrapped tool's OWN defaults, declared rather than inherited - decoupler's `min_n`
            and cellrank's terminal-state method were both being passed silently
        - name: references
          phase: build
          fills: [references]
          why: >
            every resource consulted that did not come from the user's object, with its tier - a
            reference nobody declared is one the plan cannot warn about
        - name: inventory
          phase: build
          fills: [native_plots]
          # PRESENT IS NOT FINISHED. A wrapper part-way through declares some entries AND an
          # admission naming what is left; without this the field's presence read as done.
          outstanding_if: wraps.plots_unreviewed
          why: >
            what the wrapped tool already draws. cellchat used 1 of 30 until somebody looked; after
            the accounting it uses 32 of 35
        - name: measure
          phase: test
          fills: [memory_gb_base, memory_gb_per_100k]
          # A COMMAND, LIKE `tests` AND `fixture` ALREADY ARE. The harness must not know what a
          # run directory of this tool looks like. `{run}` is filled from `--run`.
          command: ["{python}", "-m", "scprofile.cli", "capacity", "--out", "{run}", "--memory"]
          why: >
            both terms, from a real run. A rate alone attributes the fixed cost to the cells and
            the job is sized to be killed on small objects. Every run already fits this and stores
            it in report.json; `capacity --memory` is what reads it back out
        - name: judgement
          phase: build
          kind: judgement
          fills: [summary, when_to_use, cannot_show, report, upstream]
          why: >
            what no extractor can answer - what this is for, what a reader must not conclude from
            it, and the question each figure is on the page to settle
    proves: >
      its manifest resolves, its injects and needs are declarable, and the host can plan a run
      without it - a kernel that cannot be planned cannot be refused for the right reason
    cannot_prove: >
      that its numbers are right, or that its environment installs - `scprofile selftest` is the
      second question and a real run is the third
    notes: >
      A KERNEL MUST NEVER NAME ANOTHER KERNEL. It names a capability and the host resolves it;
      see needs_capabilities in scprofile/kernels.py. `scprofile scaffold` writes the build
      skeleton for a declared kernel and is the right first command.

  panel:
    what: a figure the report composes, at one shared scale across kernels
    lives: scprofile
    must_declare: [what the panel shows, what it CANNOT show, the scale it shares]
    example: compare_panel
    proves: "it draws from the merged tables and scrolls rather than rescaling per panel"
    cannot_prove: "that it reads correctly to somebody who did not build it"
