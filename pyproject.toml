[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scprofile"
dynamic = ["version"]
description = "Comprehensive profiling of an annotated single-cell or single-nucleus dataset"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jiaen Lin" }]
keywords = ["single-cell", "RNA-velocity", "SCENIC", "cell-cell-communication", "pseudotime"]

# The HOST depends on numpy and pandas. Nothing else. Every heavy or awkward dependency lives in
# a kernel's own environment, because pySCENIC and CellChat cannot share an interpreter with each
# other, with scanpy, or with this.
dependencies = ["numpy>=1.24", "pandas>=1.5"]

[project.optional-dependencies]
# reading and writing the object, and the kernels that declare needs_env: false
run = ["anndata>=0.10", "scanpy>=1.10", "h5py>=3.8"]
test = ["anndata>=0.10", "scanpy>=1.10"]

[project.urls]
Homepage = "https://github.com/JiaenLin/scProfile"
Issues = "https://github.com/JiaenLin/scProfile/issues"

[project.scripts]
scprofile = "scprofile.cli:main"

[tool.setuptools]
packages = ["scprofile"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
